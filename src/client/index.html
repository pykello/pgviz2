<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>pgviz</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"></head>
<body><div id="app">
<header><a class="brand" href="/">pgviz</a><span id="database"></span><span id="mode" class="badge" title="Demo uses illustrative data; set DATABASE_URL on the server for a live connection.">Loading</span><span id="connection">Connecting…</span><details id="tools" class="popover"><summary>More</summary><div class="menu"><button id="export">↓ Export snapshot</button><button id="pin-baseline">Pin baseline</button><details><summary>View statistics</summary><div id="metrics"></div><p id="footnote"></p></details></div></details></header>
<main><div class="viewbar"><details id="relation-picker" class="popover"><summary id="title" aria-label="Choose relation">Choose relation</summary><div class="menu relation-menu"><input id="search" placeholder="Find a relation…" aria-label="Find a relation"><div class="section-label">Relations <span id="relation-count"></span></div><div id="relations"></div></div></details><nav aria-label="Visualization"><button data-view="tree" class="active">B-tree</button><button data-view="heap">Heap page</button><button data-view="map">Page map</button><button data-view="wal">WAL</button></nav><div id="view-controls"></div><details id="commands" class="popover"><summary>Commands</summary><div class="menu command-menu"><p id="command-scope">Commands run in a separate playground table.</p><label>Template <select id="command-template"></select></label><label>Rows <input id="command-count" type="number" min="1" max="10000" value="1000"></label><p id="command-description"></p><details><summary>SQL preview</summary><pre id="command-sql"></pre></details><div class="actions"><button id="run-command">Run</button><button id="repeat-command">▶ Repeat</button></div><p id="command-result" role="status"></p></div></details><button id="refresh" title="Refresh the current view">↻ Refresh</button></div>
<div id="notice" role="status" hidden></div><div id="error" role="alert" hidden></div>
<div class="workarea" id="workarea"><section class="visual"><div id="breadcrumbs"></div><div id="canvas" aria-label="Storage visualization"></div><div id="canvas-controls"><button id="zoom-out" aria-label="Zoom out">−</button><span id="zoom-label">100%</span><button id="zoom-in" aria-label="Zoom in">+</button><button id="fit">Fit view</button></div><div id="legend"></div></section><aside class="inspector" id="inspector" hidden><div class="section-label">Attributes <button id="clear-selection" aria-label="Clear selection">×</button></div><div id="details"></div></aside></div></main></div><script type="module" src="/main.ts"></script></body></html>
